version: 1

# Grove is now an embedded library — no grove_url / grove_binary needed.

merge:
  # "static" or "dynamic" — only static is supported in 0.1.
  confidence_mode: "static"
  # If post-merge confidence drops below this, emit an AI handoff prompt
  # instead of taking the auto-merged content.
  handoff_threshold: 0.30
  # Detect breaking changes (requires Grove).
  enable_breaking_change: true
  # Include Grove-derived dependency context in handoff prompts.
  enable_context: true
  # If true, fuse will fail when Grove is unreachable. Set to false to allow
  # degraded operation (line-level merge + no breaking-change detection).
  grove_required: true
  # Build the Grove index automatically when it is empty, and delta-refresh
  # it before merges so blast-radius data reflects the working tree.
  auto_index: true

git:
  # When true, `fuse install` runs automatically the first time `fuse merge` is
  # invoked in a repo without registration.
  auto_install: false
  # "repo" (write to .gitattributes) or "global" (write to $XDG/git/attributes).
  attributes_scope: "repo"

server:
  port: 9999

resolve:
  # Shell command for `fuse resolve --apply`: reads the conflict prompt on
  # stdin and writes the complete resolved file to stdout.
  # agent_cmd: "claude -p"
  agent_cmd: ""
